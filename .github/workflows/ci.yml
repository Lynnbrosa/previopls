name: CI

on:
  push:
    branches: [main, feat/**, claude/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core · Spring Boot (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/core }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q -ntp test

  gateway:
    name: gateway · FastAPI (pytest)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/gateway }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/gateway/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  ml-api:
    name: ml-api · FastAPI + sklearn (pytest)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/ml/api }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml/api/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      # O mesmo passo do Dockerfile: o modelo padrão precisa passar na validação anti-leakage.
      - run: python -m app.build_default_model

  admin-web:
    name: admin-web · Next.js (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/admin-web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  consultor-mobile:
    name: consultor-mobile · Expo (tsc)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/consultor-mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/consultor-mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  compose:
    name: infra · docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml config -q
