user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    keepalive_timeout 30s;
    send_timeout 30s;
    client_body_timeout 15s;
    client_header_timeout 15s;

    limit_req_zone $binary_remote_addr zone=api_global:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_llm:10m rate=10r/m;
    limit_req_status 429;

    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer","http_user_agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id"}';
    access_log /var/log/nginx/access.log json_combined;

    # HSTS só fora de localhost: o navegador aplica HSTS ao host inteiro (todas as portas)
    # e, em dev, isso forçaria https em http://localhost:3000 (npm run dev) e
    # http://localhost:5000/docs por um ano. O header dos upstreams é escondido para que
    # esta regra seja a única fonte.
    map $host $hsts_value {
        default    "max-age=31536000; includeSubDomains; preload";
        localhost  "";
        ~^127\.    "";
    }
    proxy_hide_header Strict-Transport-Security;

    upstream gateway_upstream {
        server gateway:8000;
        keepalive 16;
    }

    upstream admin_web_upstream {
        server admin-web:3000;
        keepalive 16;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security $hsts_value always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        # Erros gerados pelo próprio nginx no caminho /api (rate limit, upstream fora)
        # saem em JSON no mesmo contrato {error:{code,message}} do gateway/core, para o
        # painel e clientes de API conseguirem mostrar a causa em vez de uma página HTML.
        error_page 429 = @api_429;
        error_page 502 503 504 = @api_503;
        location @api_429 {
            default_type application/json;
            add_header Retry-After 60 always;
            return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Limite de requisições excedido. Tente novamente em 60 segundos."}}';
        }
        location @api_503 {
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Serviço indisponível no momento. Tente novamente em instantes."}}';
        }

        # ------------------------------------------------------------------
        # Gateway (API pública). Só o que está sob /api/v1/ + health + docs vai
        # para o gateway. As demais rotas /api/* pertencem ao admin-web: o Next.js
        # tem route handlers próprios em /api/auth/login, /api/auth/logout e
        # /api/leads/{id}. Um "location /api/" genérico engolia essas rotas e o
        # login do painel respondia 404 do gateway ("Credenciais inválidas").
        # ------------------------------------------------------------------
        location = /api/health {
            proxy_pass http://gateway_upstream/health;
            access_log off;
        }

        # Swagger do Gateway (só em dev; em produção o gateway desliga /docs).
        # O gateway roda com ROOT_PATH=/api para que o HTML aponte para /api/openapi.json.
        location = /api/docs {
            proxy_pass http://gateway_upstream/docs;
        }
        location = /api/openapi.json {
            proxy_pass http://gateway_upstream/openapi.json;
        }
        location = /api/docs/oauth2-redirect {
            proxy_pass http://gateway_upstream/docs/oauth2-redirect;
        }

        location = /api/v1/auth/login {
            limit_req zone=api_login burst=2 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://gateway_upstream;
        }

        location /api/v1/llm-assist {
            limit_req zone=api_llm burst=3 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://gateway_upstream;
        }

        location /api/v1/ {
            limit_req zone=api_global burst=20 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://gateway_upstream;
        }

        # Route handlers do Next.js (sessão do painel). Ficam no admin-web. O painel espera até 50 s
        # pelo backend (cold start de free tier) mais 5 s de diagnóstico: o nginx precisa esperar mais
        # que isso, senão corta a resposta antes do card de erro aparecer.
        location /api/ {
            limit_req zone=api_global burst=20 nodelay;
            proxy_read_timeout 60s;
            proxy_pass http://admin_web_upstream;
        }

        # Páginas do painel: erro de upstream em HTML simples (o JSON acima é só para /api).
        location @panel_503 {
            default_type text/html;
            return 503 '<!doctype html><meta charset="utf-8"><title>PrevioPLS</title><body style="font-family:system-ui;margin:3rem"><h1>Painel indisponível</h1><p>O admin-web ainda está subindo ou está fora do ar. Tente novamente em alguns segundos.</p></body>';
        }

        location /_next/ {
            error_page 502 503 504 = @panel_503;
            proxy_pass http://admin_web_upstream;
        }

        location / {
            error_page 502 503 504 = @panel_503;
            proxy_read_timeout 60s;
            proxy_pass http://admin_web_upstream;
        }
    }
}
